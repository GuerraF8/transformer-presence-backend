name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/guerraf8/transformer-presence-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run Python tests with coverage
        run: python -m pytest -v --cov=inferencia_hub --cov-report=term-missing --cov-report=xml

      - name: Enforce global coverage floor
        # El job instala requirements-base, sin PyTorch/Transformers opcionales.
        # La linea base reproducible de ese entorno es 60.69% (piso entero: 60).
        run: python -m coverage report --fail-under=60

      - name: Enforce critical coverage
        run: >-
          python -m coverage report --fail-under=90.01
          --include="inferencia_hub/api/*,inferencia_hub/application.py,inferencia_hub/app_context.py,inferencia_hub/contracts.py,inferencia_hub/ai/persistence.py,inferencia_hub/history_store.py,inferencia_hub/profile_store.py,inferencia_hub/hub/*,inferencia_hub/runtime/history.py,inferencia_hub/runtime/home_assistant.py,inferencia_hub/runtime/layout.py,inferencia_hub/runtime/lifecycle.py,inferencia_hub/runtime/presence.py,inferencia_hub/runtime/profiles.py,inferencia_hub/runtime/shared.py"

      - name: Enforce changed-lines coverage
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="origin/${{ github.base_ref }}"
          else
            base_ref="HEAD^"
          fi
          diff-cover coverage.xml --compare-branch="$base_ref" --fail-under=90.01

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: warn

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run frontend tests and syntax checks
        run: |
          npm test
          npm run check

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: inferencia_hub/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
