services:
  inferencia_hub:
    image: "${TRANSFORMER_PRESENCE_IMAGE:-ghcr.io/guerraf8/transformer-presence-backend:latest}"
    container_name: "${TRANSFORMER_PRESENCE_CONTAINER_NAME:-transformer_presence_backend}"
    restart: unless-stopped
    ports:
      - "${TRANSFORMER_PRESENCE_BIND_HOST:-0.0.0.0}:${TRANSFORMER_PRESENCE_PORT:-8081}:8080"
    environment:
      PRESENCE_HOLD_SECONDS: "${PRESENCE_HOLD_SECONDS:-180}"
      MIN_GAP_SECONDS: "${MIN_GAP_SECONDS:-2}"
      MAX_GAP_SECONDS: "${MAX_GAP_SECONDS:-600}"
      CONFIRMED_EDGE_SUPPORT: "${CONFIRMED_EDGE_SUPPORT:-2}"
      MAX_EVENTS_BUFFER: "${MAX_EVENTS_BUFFER:-30000}"
      PET_FILTER_ENABLED: "${PET_FILTER_ENABLED:-1}"
      PET_FILTER_WINDOW_SECONDS: "${PET_FILTER_WINDOW_SECONDS:-20}"
      PET_FILTER_MIN_EVENTS: "${PET_FILTER_MIN_EVENTS:-2}"
      PET_FILTER_MIN_DISTINCT_ROOMS: "${PET_FILTER_MIN_DISTINCT_ROOMS:-1}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-*}"
      HISTORY_DB_PATH: "${HISTORY_DB_PATH:-/app/data/presence_history.sqlite3}"
      HISTORY_ENABLED: "${HISTORY_ENABLED:-1}"
      HISTORY_RETENTION_DAYS: "${HISTORY_RETENTION_DAYS:-365}"
      HISTORY_PERSIST_MODES: "${HISTORY_PERSIST_MODES:-listen,replay,simulator}"
      INFERENCIA_DATA_DIR: /app/data
      WEB_DIR: /app/inferencia_hub/web
    volumes:
      - ./data:/data:ro
      - inferencia_hub_data:/app/data

volumes:
  inferencia_hub_data:
